# Crack OS - motor antivirus ClamAV (instancia propia, servicio crackos-clamd)
# Bloqueo en tiempo real: servicio crackos-clamonacc. Los virus se aislan en /var/lib/crackos/cuarentena.
LocalSocket /run/crackos-av/clamd.sock
LocalSocketGroup clamav
LocalSocketMode 660
FixStaleSocket yes
User clamav
Foreground yes
LogSyslog yes
LogTime yes
LogFile /var/log/clamav/crackos-clamd.log
LogFileMaxSize 5M
LogRotate yes
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /var/cache/crackos-av
MaxThreads 6
MaxQueue 200
SelfCheck 3600
ConcurrentDatabaseReload no
ExitOnOOM yes

# Que se analiza
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanMail yes
ScanArchive yes
HeuristicAlerts yes
HeuristicScanPrecedence no
AlertBrokenExecutables no
DetectPUA no
MaxFileSize 100M
MaxScanSize 300M
MaxRecursion 16
MaxFiles 10000

# Al encontrar un virus: avisar a Crack Guard (notificacion + cuarentena)
VirusEvent /usr/lib/crackos/seguridad/aviso-virus

# ---- Tiempo real (clamonacc) ----
OnAccessIncludePath /home
OnAccessIncludePath /tmp
OnAccessIncludePath /var/tmp
OnAccessIncludePath /media
OnAccessPrevention yes
OnAccessExtraScanning yes
OnAccessExcludeUname clamav
OnAccessExcludeRootUID yes
OnAccessMaxFileSize 30M
OnAccessMaxThreads 4
OnAccessCurlTimeout 10000
OnAccessRetryAttempts 1
