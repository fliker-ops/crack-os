# Crack Guard - vigilante de procesos sospechosos de Crack OS
# Tras cambiar algo:  sudo systemctl reload crackos-guard   (o usa el panel: crackguard)

# bloquear = congela lo peligroso y te pregunta (recomendado) | avisar = solo avisa
modo = bloquear

# cada cuantos segundos revisa los procesos
intervalo = 2

# minero oculto: % de CPU sostenido durante N segundos desde un lugar sospechoso
cpu_umbral = 85
cpu_segundos = 90

# avisos en pantalla, cambios en archivos criticos, puertos abiertos
avisos_escritorio = si
vigilar_archivos = si
vigilar_puertos = si

# escanear automaticamente las USB al conectarlas
escanear_usb = si

# antivirus en tiempo real (lo decide el instalador segun la RAM; cambia con: crackguard tiempo-real si|no)
antivirus_tiempo_real = si
