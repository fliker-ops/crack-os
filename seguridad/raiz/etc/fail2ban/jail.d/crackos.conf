# Crack OS - bloqueo de ataques de fuerza bruta (usa el firewall UFW)
[DEFAULT]
backend = systemd
banaction = ufw
banaction_allports = ufw
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
findtime = 10m
maxretry = 4
ignoreip = 127.0.0.1/8 ::1

[sshd]
enabled = true
mode = aggressive

[recidive]
enabled = true
logpath = /var/log/fail2ban.log
backend = auto
bantime = 1w
findtime = 1d
