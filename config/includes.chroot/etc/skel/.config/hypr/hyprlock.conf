# Crack OS - pantalla de bloqueo
general {
    hide_cursor = true
    grace = 0
}

background {
    path = /usr/share/backgrounds/crackos/crackos-login.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(255, 255, 255, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 220
    halign = center
    valign = center
}
label {
    text = cmd[update:60000] echo "$(LC_TIME=es_ES.UTF-8 date '+%A %d de %B')"
    color = rgba(220, 200, 202, 0.9)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}
image {
    path = /usr/share/crackos/face.png
    size = 120
    rounding = 18
    border_size = 2
    border_color = rgba(255, 40, 50, 0.9)
    position = 0, 0
    halign = center
    valign = center
}
label {
    text = $USER
    color = rgba(255, 255, 255, 0.95)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -90
    halign = center
    valign = center
}
input-field {
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(255, 40, 50, 0.9)
    inner_color = rgba(14, 8, 10, 0.85)
    font_color = rgba(255, 255, 255, 1.0)
    fade_on_empty = false
    placeholder_text = <i>Contraseña</i>
    fail_text = <b>Contraseña incorrecta</b>
    check_color = rgba(255, 180, 70, 1.0)
    fail_color = rgba(255, 40, 50, 1.0)
    rounding = 26
    position = 0, -170
    halign = center
    valign = center
}
