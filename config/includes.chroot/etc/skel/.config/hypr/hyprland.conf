# ┌──────────────────────────────────────────────┐
# │  CRACK OS · Hyprland                          │
# │  Configuracion base del sistema: /usr/share/crackos/hypr
# │  Tus cambios van al final de este archivo.    │
# └──────────────────────────────────────────────┘

monitor = , preferred, auto, 1

source = /usr/share/crackos/hypr/env.conf
source = /usr/share/crackos/hypr/theme.conf
source = /usr/share/crackos/hypr/shadow.conf
source = /usr/share/crackos/hypr/rules.conf
source = /usr/share/crackos/hypr/keybinds.conf
source = /usr/share/crackos/hypr/autostart.conf

input {
    kb_layout = latam
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# ── Tus ajustes ─────────────────────────────────
