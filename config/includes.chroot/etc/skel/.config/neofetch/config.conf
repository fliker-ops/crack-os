# Crack OS - neofetch
print_info() {
    prin "$(color 1)eat 󰩰 ; sleep 󰒲 ; code  ; repeat "
    prin "$(color 8)──────────── $(color 1)HARDWARE$(color 8) ────────────"
    info "$(color 1)󰌢 " model
    info "$(color 1) " cpu
    info "$(color 1)󰍹 " gpu
    info "$(color 1) " memory
    info "$(color 1)󰍺 " resolution
    prin "$(color 8)──────────── $(color 1)SOFTWARE$(color 8) ────────────"
    info "$(color 1) " distro
    info "$(color 1) " kernel
    info "$(color 1)󰏖 " packages
    info "$(color 1) " de
    info "$(color 1) " wm
    info "$(color 1)󰉼 " theme
    info "$(color 1) " term_font
    info "$(color 1)󰅐 " uptime
    prin "$(color 8)────────────────────────────────────"
    info cols
}
title_fqdn="off"
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="tiny"
memory_percent="on"
package_managers="on"
shell_version="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
gpu_brand="on"
gpu_type="all"
de_version="off"
colors=(1 1 8 1 7 7)
bold="on"
separator="  "
block_range=(0 15)
color_blocks="on"
block_width=3
block_height=1
image_backend="ascii"
image_source="/etc/crackos/skull.txt"
ascii_distro="auto"
ascii_colors=(1 9 1)
ascii_bold="on"
gap=3
