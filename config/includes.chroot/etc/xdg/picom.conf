# Crack OS - compositor (esquinas redondeadas, sombras, transparencia suave)
backend = "xrender";
vsync = true;
corner-radius = 12;
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Xfce4-panel'" ];
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-color = "#000000";
shadow-exclude = [ "window_type = 'desktop'", "class_g = 'Xfce4-screenshooter'", "_GTK_FRAME_EXTENTS@:c" ];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
inactive-opacity = 0.97;
opacity-rule = [ "94:class_g = 'Xfce4-terminal' && focused", "88:class_g = 'Xfce4-terminal' && !focused" ];
mark-wmwin-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
