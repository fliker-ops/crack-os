# Crack OS: nombre, tema y animacion de arranque
# El id EFI debe seguir siendo "debian" (Secure Boot). El nombre del menu lo pone /etc/grub.d/10_linux.
GRUB_DISTRIBUTOR="Debian"
GRUB_THEME="/boot/grub/themes/crackos/theme.txt"
GRUB_GFXMODE="1920x1080,1366x768,auto"
GRUB_GFXPAYLOAD_LINUX="keep"
GRUB_TIMEOUT_STYLE="menu"
GRUB_TIMEOUT=5
GRUB_DISABLE_OS_PROBER=false
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
  *" splash "*) ;;
  *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet splash" ;;
esac
