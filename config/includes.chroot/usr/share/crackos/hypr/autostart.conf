# Crack OS - programas al iniciar la sesion
exec-once = /usr/local/bin/crackos-session
exec-once = waybar
exec-once = swaync
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = swayidle -w timeout 600 'crackos-lock' timeout 900 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'crackos-lock'
exec-once = sh -c 'command -v wl-paste >/dev/null && command -v cliphist >/dev/null && wl-paste --watch cliphist store'
