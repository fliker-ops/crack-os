# Crack OS - reglas de ventanas
windowrulev2 = opacity 0.90 0.84, class:^(thunar|Thunar)$
windowrulev2 = opacity 0.94 0.88, class:^(mousepad|org.xfce.mousepad)$
windowrulev2 = float, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = size 760 520, class:^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrulev2 = float, class:^(blueman-manager|nm-connection-editor|file-roller|org.gnome.FileRoller)$
windowrulev2 = float, class:^(nwg-look|qt5ct|qt6ct)$
windowrulev2 = float, title:^(Imagen en imagen|Picture-in-Picture)$
windowrulev2 = pin, title:^(Imagen en imagen|Picture-in-Picture)$
windowrulev2 = float, class:^(calamares|io.calamares.calamares)$
windowrulev2 = center, class:^(calamares|io.calamares.calamares)$
windowrulev2 = float, class:^(crackos-float)$
windowrulev2 = size 900 560, class:^(crackos-float)$
windowrulev2 = center, class:^(crackos-float)$
windowrulev2 = float, title:^(Abrir archivo|Guardar como|Open File|Save As)(.*)$
windowrulev2 = suppressevent maximize, class:.*

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
