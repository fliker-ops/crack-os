# Crack OS - reglas de ventanas (sintaxis Hyprland 0.53+)
windowrule = opacity 0.90 0.84, match:class ^(thunar|Thunar)$
windowrule = opacity 0.94 0.88, match:class ^(mousepad|org.xfce.mousepad)$
windowrule = float on, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = size 760 520, match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^(blueman-manager|nm-connection-editor|file-roller|org.gnome.FileRoller)$
windowrule = float on, match:class ^(nwg-look|qt5ct|qt6ct)$
windowrule = float on, match:title ^(Imagen en imagen|Picture-in-Picture)$
windowrule = pin on, match:title ^(Imagen en imagen|Picture-in-Picture)$
windowrule = float on, match:class ^(calamares|io.calamares.calamares)$
windowrule = center on, match:class ^(calamares|io.calamares.calamares)$
windowrule = float on, match:class ^(crackos-float)$
windowrule = size 900 560, match:class ^(crackos-float)$
windowrule = center on, match:class ^(crackos-float)$
windowrule = float on, match:title ^(Abrir archivo|Guardar como|Open File|Save As)(.*)$
windowrule = suppress_event maximize, match:class .*

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha 0, match:namespace wofi
layerrule = blur on, match:namespace ^(swaync-control-center|swaync-notification-window)$
layerrule = ignore_alpha 0, match:namespace ^(swaync-control-center|swaync-notification-window)$
