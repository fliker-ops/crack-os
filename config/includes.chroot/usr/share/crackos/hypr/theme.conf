# Crack OS - apariencia: ventanas flotando con esquinas redondeadas, borde rojo y desenfoque
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ff2832ee) rgba(ff6a3dcc) 45deg
    col.inactive_border = rgba(3a0c10aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.92
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.2
    }
}

animations {
    enabled = true
    bezier = suave, 0.05, 0.9, 0.1, 1.05
    bezier = salida, 0.3, 0, 0.8, 0.15
    animation = windows, 1, 6, suave
    animation = windowsOut, 1, 5, salida, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 40, default, loop
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, suave, slidevert
    animation = layers, 1, 4, suave, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
    focus_on_activate = true
    animate_manual_resizes = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}
