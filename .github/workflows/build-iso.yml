name: Compilar ISO de Crack OS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Liberar espacio en el disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Compilar en Debian 12 (live-build)
        run: |
          sudo docker run --rm --privileged \
            -v "$PWD":/build -w /build debian:bookworm \
            bash -c "./build.sh"

      - name: Subir registro de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Subir ISO
        uses: actions/upload-artifact@v4
        with:
          name: crack-os-1.0-amd64
          path: |
            crack-os-1.0-amd64.iso
            crack-os-1.0-amd64.iso.sha256
          compression-level: 0
          retention-days: 30

      - name: Adjuntar ISO al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown "$USER" crack-os-1.0-amd64.iso*
          split -b 1900M -d crack-os-1.0-amd64.iso crack-os-1.0-amd64.iso.part
          gh release upload "${{ github.event.release.tag_name }}" crack-os-1.0-amd64.iso.part* crack-os-1.0-amd64.iso.sha256 --clobber
