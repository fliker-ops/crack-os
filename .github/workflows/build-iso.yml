name: Compilar ISO de Crack OS

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Liberar espacio en el disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - name: Compilar en Debian 13 (live-build)
        run: |
          sudo docker run --rm --privileged \
            -v "$PWD":/build -w /build debian:trixie \
            bash -c "./build.sh"

      - name: Subir registro de compilacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Subir ISO
        uses: actions/upload-artifact@v4
        with:
          name: crack-os-1.0-amd64
          path: |
            crack-os-1.0-amd64.iso
            crack-os-1.0-amd64.iso.sha256
          compression-level: 0
          retention-days: 30

      - name: Probar arranque en QEMU y guardar capturas
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf socat imagemagick ffmpeg >/dev/null
          sudo chmod 666 /dev/kvm || true
          tests/qemu-screens.sh crack-os-1.0-amd64.iso
          git config user.name "crackos-ci"
          git config user.email "crackos-ci@users.noreply.github.com"
          tmp=$(mktemp -d); cp -r screens "$tmp/"
          git checkout --orphan capturas
          git rm -rfq . >/dev/null
          cp -r "$tmp/screens" . && git add screens
          git commit -qm "Capturas de arranque de ${GITHUB_SHA::7}"
          git push -f origin capturas

      - name: Adjuntar ISO al release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo chown "$USER" crack-os-1.0-amd64.iso*
          split -b 1900M -d crack-os-1.0-amd64.iso crack-os-1.0-amd64.iso.part
          gh release upload "${{ github.event.release.tag_name }}" crack-os-1.0-amd64.iso.part* crack-os-1.0-amd64.iso.sha256 --clobber
