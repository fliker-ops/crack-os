name: Sondeo de paquetes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml', 'config/includes.chroot/usr/share/crackos/hypr/**', 'config/includes.chroot/etc/skel/.config/hypr/**']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/w debian:trixie bash -c '
            echo "deb http://deb.debian.org/debian trixie-backports main contrib" > /etc/apt/sources.list.d/bp.list
            printf "Package: *hypr* *aquamarine*\nPin: release a=trixie-backports\nPin-Priority: 990\n" > /etc/apt/preferences.d/hypr
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq hyprland hyprlock hypridle >/tmp/i.log 2>&1 || tail -30 /tmp/i.log
            Hyprland --version | head -3
            echo "===== CONFIG POR DEFECTO ====="
            cat /usr/share/hypr/hyprland.conf
            echo "===== VERIFICAR CRACK OS ====="
            mkdir -p /usr/share/crackos && cp -r /w/config/includes.chroot/usr/share/crackos/hypr /usr/share/crackos/
            Hyprland --verify-config -c /w/config/includes.chroot/etc/skel/.config/hypr/hyprland.conf 2>&1 | tail -40
          '
