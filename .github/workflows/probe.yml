name: Sondeo de paquetes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml', 'config/includes.chroot/usr/share/crackos/hypr/**', 'config/includes.chroot/etc/skel/.config/hypr/**']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm --privileged -v "$PWD":/w debian:trixie bash -c '
            echo "deb http://deb.debian.org/debian trixie-backports main contrib" > /etc/apt/sources.list.d/bp.list
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq -t trixie-backports hyprland hyprlock hypridle hyprpaper xdg-desktop-portal-hyprland >/tmp/i.log 2>&1 || tail -30 /tmp/i.log
            export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
            Hyprland --version | head -3
            echo "===== CONFIG POR DEFECTO ====="
            dpkg -L hyprland | grep -iE "conf|exampl|hypr/" | head; f=$(dpkg -L hyprland | grep -iE "hyprland.conf" | head -1); zcat -f "$f" | grep -vE "^\s*(#|$)"
            echo "===== VERIFICAR CRACK OS ====="
            mkdir -p /usr/share/crackos && cp -r /w/config/includes.chroot/usr/share/crackos/hypr /usr/share/crackos/
            Hyprland --i-am-really-stupid --verify-config -c /w/config/includes.chroot/etc/skel/.config/hypr/hyprland.conf 2>&1 | tail -40
          '
