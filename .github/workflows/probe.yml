name: Sondeo de paquetes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml', 'config/includes.chroot/usr/share/sddm/**']
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v "$PWD":/w debian:trixie bash -c '
            apt-get update -qq >/dev/null 2>&1
            echo "===== OPCIONALES ====="
            for p in $(grep -v "^\s*#" /w/config/optional-packages.list); do apt-cache show "$p" >/dev/null 2>&1 && echo "+ $p" || echo "- $p"; done
            echo "===== SDDM ====="
            apt-cache policy sddm | head -3; apt-cache depends sddm | grep -iE "qt|qml|greeter"
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends sddm qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript qml-module-qtquick2 qml-module-qtquick-window2 xauth >/tmp/i.log 2>&1 || tail -20 /tmp/i.log
            ls /usr/bin | grep -i sddm
            export XDG_RUNTIME_DIR=/tmp/xdg QT_QPA_PLATFORM=offscreen; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
            for g in /usr/bin/sddm-greeter*; do echo "--- $g"; timeout 12 $g --test-mode --theme /w/config/includes.chroot/usr/share/sddm/themes/crackos 2>&1 | grep -viE "^$" | head -40; done
          '
